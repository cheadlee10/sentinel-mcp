name: Publish to MCP Registry

# Lists or updates server.json in the official MCP Registry whenever a change
# to server.json (or this workflow) lands on main, on a v* tag, or when run by
# hand from the Actions tab. Signs in with GitHub OIDC, so the repository
# needs no secret.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["server.json", ".github/workflows/publish-mcp.yml"]
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Check server.json is valid JSON
        run: jq empty server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Sign in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
